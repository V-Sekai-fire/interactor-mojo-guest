name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/V-Sekai-fire/repository-riscv64-sysroot ../riscv64-sysroot
      - uses: prefix-dev/setup-pixi@v0.8.1
      - run: pixi run build
