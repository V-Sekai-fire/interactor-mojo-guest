[workspace]
name = "interactor-mojo-guest"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo-compiler = "==1.3.0.dev2026111316"
clangxx = ">=18"
lld = ">=18"
python = "3.12.*"

[tasks]
build = "./build.sh"
test = { cmd = "test/run_godot.sh", depends-on = ["build"] }
test-rvlinux = { cmd = "test/run_rvlinux.sh", depends-on = ["build"] }
test-limits = "test/run_limits.sh"
