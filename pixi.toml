[workspace]
name = "interactor-mojo-guest"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo-compiler = "==1.3.0.dev2026111316"
clangxx = ">=18"
lld = ">=18"
elixir = "*"

[tasks]
build = "elixir tools/build.exs"
test = "elixir tools/test.exs godot"
test-rvlinux = "elixir tools/test.exs rvlinux"
test-limits = "elixir tools/test.exs limits"
test-hostlimits = "elixir tools/test.exs hostlimits"
test-clocks = "elixir tools/test.exs clocks"
